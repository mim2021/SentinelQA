[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustguard"
version = "1.1.0"
description = "Behavioural detection of compromised-but-trusted accounts on chat platforms"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
discord = ["discord.py>=2.5,<3"]
slack = ["slack_bolt>=1.20,<2"]

[tool.setuptools.packages.find]
include = ["trustguard*"]

[tool.setuptools.package-data]
"trustguard.core" = ["shared_rules.json"]
