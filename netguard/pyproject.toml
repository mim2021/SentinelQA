[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netguard"
version = "0.1.0"
description = "Passive public-Wi-Fi interception checks: router change, DNS tampering, certificate errors"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
netguard = "netguard.__main__:main"

[tool.setuptools.packages.find]
include = ["netguard*"]
