<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; font-family: Arial, sans-serif; padding: 14px; margin: 0; background: #f9fafb; }
    h1 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
    #grade { font-size: 42px; font-weight: bold; text-align: center; padding: 10px; border-radius: 10px; color: #fff; }
    .A { background: #16a34a; }
    .B { background: #65a30d; }
    .C { background: #d97706; }
    .D { background: #ea580c; }
    .F { background: #dc2626; }
    #label { text-align: center; margin-top: 6px; font-weight: bold; }
    #score { text-align: center; color: #6b7280; font-size: 12px; margin-top: 2px; }
    #site { text-align: center; font-size: 12px; color: #374151; margin: 8px 0; word-break: break-all; }
    #findings { list-style: none; padding: 0; margin: 10px 0 0; font-size: 12px; }
    #findings li { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 6px 8px; margin-bottom: 5px; color: #374151; }
    #rescan { width: 100%; margin-top: 10px; padding: 8px; border: 0; border-radius: 6px; background: #111827; color: #fff; font-weight: bold; cursor: pointer; }
    #note { font-size: 10px; color: #9ca3af; text-align: center; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>&#128737;&#65039; SentinelQA</h1>
  <div id="grade">?</div>
  <div id="label">Scanning...</div>
  <div id="score"></div>
  <div id="site"></div>
  <ul id="findings"></ul>
  <button id="rescan">Re-scan this page</button>
  <div id="note">v0.2.0 - URL-level checks only. Page-level checks coming next.</div>
  <script src="popup.js"></script>
</body>
</html>
